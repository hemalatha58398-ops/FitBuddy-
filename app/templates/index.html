<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy - AI Workout Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>🏋️ FitBuddy</h1>
    <p style="text-align:center">AI Workout Generator</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form action="/generate-workout" method="post">
      <label>Name</label>
      <input type="text" name="username" required>

      <label>User ID</label>
      <input type="text" name="user_id" required>

      <label>Age</label>
      <input type="number" name="age" min="10" max="100" required>

      <label>Weight (kg)</label>
      <input type="number" name="weight" step="0.1" min="21" required>

      <label>Fitness Goal</label>
      <select name="goal" required>
        <option value="weight loss">Weight Loss</option>
        <option value="muscle gain">Muscle Gain</option>
        <option value="flexibility">Flexibility</option>
        <option value="general wellness">General Wellness</option>
      </select>

      <label>Workout Intensity</label>
      <select name="intensity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>

    <div class="nav"><a href="/view-all-users">Admin: View all users</a></div>
  </div>
</body>
</html>
